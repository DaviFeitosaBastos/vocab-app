<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vocab App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <!-- Header -->
      <header class="header">
        <span class="header__logo">vocab</span>
        <nav class="header__nav">
          <button class="nav-btn active" data-screen="daily">Daily</button>
          <button class="nav-btn" data-screen="search">Search</button>
          <button class="nav-btn" data-screen="progress">Progress</button>
        </nav>
      </header>

      <!-- Screen: Daily Word -->
      <section id="screen-daily" class="screen active">
        <div class="daily__meta">Word of the day</div>
        <h1 class="daily__word" id="daily-word">serendipity</h1>
        <p class="daily__pos" id="daily-pos">Noun</p>
        <p class="daily__definition" id="daily-definition">
          The occurrence of events by chance in a happy or beneficial way.
        </p>
        <div class="daily__synonyms" id="daily-synonyms">
          <span class="tag">luck</span>
          <span class="tag">chance</span>
          <span class="tag">fortune</span>
        </div>
        <button class="btn" id="btn-next">Next word →</button>
      </section>

      <!-- Screen: Search -->
      <section id="screen-search" class="screen">
        <h2 class="screen__title">Search</h2>
        <div class="search__bar">
          <input
            type="text"
            id="search-input"
            class="search__input"
            placeholder="Type a word..."
            autocomplete="off"
          />
          <button class="btn" id="btn-search">Search</button>
        </div>
        <div id="search-result" class="search__result hidden">
          <p class="result__word" id="result-word"></p>
          <p class="result__pos" id="result-pos"></p>
          <p class="result__definition" id="result-definition"></p>
          <div class="result__synonyms" id="result-synonyms"></div>
        </div>
        <div id="search-empty" class="search__empty hidden">
          Word not found.
        </div>
      </section>

      <!-- Screen: Progress -->
      <section id="screen-progress" class="screen">
        <h2 class="screen__title">Progress</h2>
        <div class="progress__stats">
          <div class="stat">
            <span class="stat__number" id="stat-seen">0</span>
            <span class="stat__label">words seen</span>
          </div>
          <div class="stat__divider"></div>
          <div class="stat">
            <span class="stat__number" id="stat-remaining">0</span>
            <span class="stat__label">remaining</span>
          </div>
          <div class="stat__divider"></div>
          <div class="stat">
            <span class="stat__number" id="stat-percent">0%</span>
            <span class="stat__label">complete</span>
          </div>
        </div>
        <div class="progress__bar-wrapper">
          <div class="progress__bar" id="progress-bar"></div>
        </div>
        <div class="progress__list" id="progress-list">
          <!-- seen words render here -->
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
